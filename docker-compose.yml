# =============================================================================
# Commart Platform — Production Docker Compose
# Single-server deployment (Hetzner CX41: 4 vCPU, 16GB RAM)
#
# Start:    docker compose up -d
# Stop:     docker compose down
# Logs:     docker compose logs -f <service-name>
# Scale:    docker compose up -d --scale order-service=2
#
# Memory budget: ~14GB usable (2GB for OS/Docker)
#   Infrastructure: ~3.5GB
#   Application services: ~10GB (38 services × 256MB avg)
# =============================================================================

x-java-service: &java-service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
  environment: &java-env
    SPRING_PROFILES_ACTIVE: prod
    SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
    SPRING_DATASOURCE_USERNAME: commart
    SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-commart123}
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017
    SPRING_DATA_REDIS_HOST: redis
    JAVA_OPTS: "-Xms64m -Xmx192m"
  networks:
    - commart

services:

  # ═══════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ═══════════════════════════════════════════════════════════════════════════

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: commart
      POSTGRES_PASSWORD: ${DB_PASSWORD:-commart123}
      POSTGRES_MULTIPLE_DATABASES: >-
        orderdb,sellerdb,carrierdb,transportdb,billing_db,deliverydb,
        lineage_db,wmsdb,paymentdb,cartdb,userdb,authdb,storedb,
        communitydb,catalogdb,customerdb,financedb,escrowdb,
        subscriptiondb,contractdb,notificationdb,spacedb,
        shipmentdb,allocationdb,labeldb,locationdb,disputedb,
        auditdb,workflowdb,pricingdb,inventorydb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commart"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      - commart

  mongodb:
    image: mongo:7-jammy
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - commart

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - commart

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - commart

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - commart

  # ═══════════════════════════════════════════════════════════════════════════
  # PLATFORM INFRA SERVICES
  # ═══════════════════════════════════════════════════════════════════════════

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: start-dev
    ports:
      - "8080:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloakdb
      KC_DB_USERNAME: commart
      KC_DB_PASSWORD: ${DB_PASSWORD:-commart123}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      KC_HOSTNAME: auth.commart.co.in
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3 && cat <&3 | grep -q '200'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - commart

  config-server:
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-config-server:latest
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: https://github.com/${GITHUB_ORG:-prasannakrishna}/configuration.git
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-Xms48m -Xmx128m"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 192M
    networks:
      - commart

  # ═══════════════════════════════════════════════════════════════════════════
  # CORE SERVICES (Tier 1 — must run)
  # ═══════════════════════════════════════════════════════════════════════════

  auth-service:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-auth-service:latest
    container_name: auth-service
    ports: ["8097:8097"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/authdb
    volumes:
      - auth_jwks:/root/.scm

  user-service:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-user-service:latest
    container_name: user-service
    ports: ["8087:8087"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/userdb

  customer-service:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-customer-service:latest
    container_name: customer-service
    ports: ["8082:8082"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/customerdb

  cart-manager:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-cart-manager:latest
    container_name: cart-manager
    ports: ["8091:8091"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cartdb
      SPRING_DATA_MONGODB_DATABASE: cartdb

  order-service:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-order-service:latest
    container_name: order-service
    ports: ["8093:8093"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderdb

  catalog-service:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-catalog-service:latest
    container_name: catalog-service
    ports: ["8089:8089"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalogdb
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200

  community-manager:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-community-manager:latest
    container_name: community-manager
    ports: ["8081:8081"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/communitydb
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200

  payment-service:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-payment-service:latest
    container_name: payment-service
    ports: ["8085:8085"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/paymentdb

  seller-service:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-seller-service:latest
    container_name: seller-service
    ports: ["8088:8088"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sellerdb

  notification-service:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-notification-service:latest
    container_name: notification-service
    ports: ["8096:8096"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notificationdb

  # ═══════════════════════════════════════════════════════════════════════════
  # FULFILLMENT SERVICES (Tier 2)
  # ═══════════════════════════════════════════════════════════════════════════

  allocation-service:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-allocation-service:latest
    container_name: allocation-service
    ports: ["8109:8109"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/allocationdb

  order-grouping-service:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-order-grouping-service:latest
    container_name: order-grouping-service
    ports: ["8088:8088"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderdb

  wms-service:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-wms-service:latest
    container_name: wms-service
    ports: ["8110:8110"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wmsdb

  store-service:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-store-service:latest
    container_name: store-service
    ports: ["8092:8092"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/storedb

  carrier-service:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-carrier-service:latest
    container_name: carrier-service
    ports: ["8083:8083"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/carrierdb

  transport-planner:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-transport-planner:latest
    container_name: transport-planner
    ports: ["8108:8108"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transportdb

  delivery-service:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-delivery-service:latest
    container_name: delivery-service
    ports: ["8100:8100"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deliverydb

  shipment-service:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-shipment-service:latest
    container_name: shipment-service
    ports: ["8086:8086"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shipmentdb

  shipment-package-service:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-shipment-package-service:latest
    container_name: shipment-package-service
    ports: ["8111:8111"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shipmentdb

  label-generator:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-label-generator:latest
    container_name: label-generator
    ports: ["8103:8103"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/labeldb

  location-manager:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-location-manager:latest
    container_name: location-manager
    ports: ["8089:8089"]
    environment:
      <<: *java-env
      SPRING_DATA_MONGODB_DATABASE: locationdb

  # ═══════════════════════════════════════════════════════════════════════════
  # FINANCE SERVICES (Tier 3)
  # ═══════════════════════════════════════════════════════════════════════════

  billing-engine:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-billing-svc:latest
    container_name: billing-engine
    ports: ["8135:8135"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/billing_db

  finance-service:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-finance-service:latest
    container_name: finance-service
    ports: ["8107:8107"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/financedb

  escrow-gateway:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-escrow-gateway-service:latest
    container_name: escrow-gateway
    ports: ["8130:8130"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/escrowdb

  subscription-billing:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-subscription-billing-service:latest
    container_name: subscription-billing
    ports: ["8136:8136"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/subscriptiondb

  contract-manager:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-contract-manager:latest
    container_name: contract-manager
    ports: ["8105:8105"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/contractdb

  lineage-service:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-lineage-service:latest
    container_name: lineage-service
    ports: ["8145:8145"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lineage_db

  # ═══════════════════════════════════════════════════════════════════════════
  # INTELLIGENCE & OPS (Tier 4 — can be started later)
  # ═══════════════════════════════════════════════════════════════════════════

  sla-watchdog:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-sla-watchdog-service:latest
    container_name: sla-watchdog
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/disputedb

  dispute-service:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-dispute-service:latest
    container_name: dispute-service
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/disputedb

  feed-service:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-feed-service:latest
    container_name: feed-service
    ports: ["8101:8101"]
    environment:
      <<: *java-env
      SPRING_DATA_MONGODB_DATABASE: feeddb

  supply-mate-service:
    <<: *java-service
    image: ghcr.io/${GHCR_ORG:-prasannakrishna}/commart-supply-mate-service:latest
    container_name: supply-mate-service
    ports: ["8118:8118"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/supplydb

  # ═══════════════════════════════════════════════════════════════════════════
  # NGINX REVERSE PROXY (API Gateway — replaces ALB)
  # ═══════════════════════════════════════════════════════════════════════════

  nginx:
    image: nginx:alpine
    container_name: nginx-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - auth-service
      - user-service
      - order-service
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - commart

# ═══════════════════════════════════════════════════════════════════════════
# VOLUMES
# ═══════════════════════════════════════════════════════════════════════════

volumes:
  pg_data:
  mongo_data:
  kafka_data:
  redis_data:
  es_data:
  auth_jwks:

networks:
  commart:
    driver: bridge
