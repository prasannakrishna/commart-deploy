worker_processes auto;
events { worker_connections 1024; }

http {
    resolver 127.0.0.11 valid=10s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    map $http_origin $cors_origin {
        "https://commart.co.in"     "https://commart.co.in";
        "https://www.commart.co.in" "https://www.commart.co.in";
        "https://portal.commart.co.in" "https://portal.commart.co.in";
        "https://admin.commart.co.in"  "https://admin.commart.co.in";
        default "";
    }

    server {
        listen 80;
        server_name api.commart.co.in;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name api.commart.co.in;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Seller-Id, X-User-Id, Accept, DPoP" always;
        add_header Access-Control-Allow-Credentials "true" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location /health {
            add_header Content-Type application/json;
            return 200 "{\"status\":\"ok\"}";
        }

        # ── All proxy_pass targets below use a variable ($xxx_up) instead of a
        # literal hostname. With a literal hostname, nginx resolves it ONCE at
        # config load / container startup and refuses to start at all if that
        # service happens to be down at that moment ("host not found in
        # upstream") -- which takes down this entire gateway, not just the one
        # path, for every service it proxies to. With a variable, resolution is
        # deferred to request time via the `resolver` directive above, so one
        # dead backend only affects requests to that backend, exactly like the
        # /superset/ block below already did before this change.

        location /obs/loki/ {
            set $loki_up http://loki:3100;
            rewrite ^/obs/loki/(.*)$ /$1 break;
            proxy_pass $loki_up;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }
        location /obs/prometheus/ {
            set $prometheus_up http://prometheus:9090;
            rewrite ^/obs/prometheus/(.*)$ /$1 break;
            proxy_pass $prometheus_up;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }
        location /obs/grafana/ {
            set $grafana_up http://grafana:3000;
            rewrite ^/obs/grafana/(.*)$ /grafana/$1 break;
            proxy_pass $grafana_up;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }

        location / { return 404; }

        location /customer/api/users/token {
            set $customer_up http://customer-service:8082;
            rewrite ^/customer/api/users/token$ /api/users/validate break;
            proxy_pass $customer_up;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }
        location /customer/  {
            set $customer_up http://customer-service:8082;
            rewrite ^/customer/(.*)$ /$1 break;
            proxy_pass $customer_up;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }
        location /auth/      {
            set $auth_up http://auth-service:8097;
            rewrite ^/auth/(.*)$ /$1 break;
            proxy_pass $auth_up;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }
        location /auth-svc/  {
            set $auth_up http://auth-service:8097;
            rewrite ^/auth-svc/(.*)$ /$1 break;
            proxy_pass $auth_up;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }
        location /user/      {
            set $user_up http://user-service:8087;
            rewrite ^/user/(.*)$ /$1 break;
            proxy_pass $user_up;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }
        location /cart/      {
            set $cart_up http://cart-manager:8091;
            rewrite ^/cart/(.*)$ /$1 break;
            proxy_pass $cart_up;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }
        location /order/     {
            set $order_up http://order-service:8093;
            rewrite ^/order/(.*)$ /$1 break;
            proxy_pass $order_up;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }
        location /catalog/   {
            set $catalog_up http://catalog-service:8089;
            rewrite ^/catalog/(.*)$ /$1 break;
            proxy_pass $catalog_up;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }
        location /community/ {
            set $community_up http://community-manager:8081;
            rewrite ^/community/(.*)$ /$1 break;
            proxy_pass $community_up;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }
        location /seller/    {
            set $seller_up http://seller-service:8088;
            rewrite ^/seller/(.*)$ /$1 break;
            proxy_pass $seller_up;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }
        location /payment/   {
            set $payment_up http://payment-service:8085;
            rewrite ^/payment/(.*)$ /$1 break;
            proxy_pass $payment_up;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }
        location /notification/ {
            set $notification_up http://notification-service:8096;
            rewrite ^/notification/(.*)$ /$1 break;
            proxy_pass $notification_up;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }
        location /audit/     {
            set $audit_up http://audit-service:8104;
            rewrite ^/audit/(.*)$ /$1 break;
            proxy_pass $audit_up;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }
        location /data/ {
            set $analytics_up http://analytics-api:8001;
            rewrite ^/data/(.*)$ /$1 break;
            proxy_pass $analytics_up;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Vary;
        }
        location /airflow/   {
            set $airflow_up http://airflow-webserver:8080;
            proxy_pass $airflow_up;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /superset/  {
            set $superset_up http://superset:8088;
            proxy_pass $superset_up/;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /api/v1/ {
            set $superset_up http://superset:8088;
            proxy_pass $superset_up/api/v1/;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }
        location /static/    { set $superset_up http://superset:8088;
            proxy_pass $superset_up/static/; }
        location /label/     {
            set $label_up http://label-generator:8103;
            rewrite ^/label/(.*)$ /$1 break;
            proxy_pass $label_up;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }
        location /feed/      {
            set $feed_up http://feed-service:8101;
            rewrite ^/feed/(.*)$ /$1 break;
            proxy_pass $feed_up;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }
    }
}
