# Commart API Gateway — Nginx reverse proxy
# Routes api.commart.co.in/<path> to the correct backend service

worker_processes auto;
events { worker_connections 1024; }

http {
    # Timeouts for Java services (they can be slow on cold start)
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # CORS headers (applied to all responses)
    map $http_origin $cors_origin {
        default "";
        "https://commart.co.in"         $http_origin;
        "https://www.commart.co.in"     $http_origin;
        "https://app.commart.co.in"     $http_origin;
        "https://portal.commart.co.in"  $http_origin;
        "https://admin.commart.co.in"   $http_origin;
        "http://localhost:5173"         $http_origin;
        "http://localhost:5174"         $http_origin;
    }

    server {
        listen 80;
        server_name api.commart.co.in;

        # Health check
        location /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Seller-Id, X-User-Id';
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Max-Age' 3600;
            return 204;
        }

        # Add CORS to all responses
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # ── Identity & Auth ──
        location /auth/     { proxy_pass http://auth-service:8097/auth/; }
        location /user/     { proxy_pass http://user-service:8087/; }

        # ── Commerce ──
        location /customer/ { proxy_pass http://customer-service:8082/; }
        location /cart/     { proxy_pass http://cart-manager:8091/; }
        location /order/    { proxy_pass http://order-service:8093/; }
        location /catalog/  { proxy_pass http://catalog-service:8089/; }
        location /community/{ proxy_pass http://community-manager:8081/; }

        # ── Fulfillment ──
        location /seller/   { proxy_pass http://seller-service:8088/; }
        location /allocation/ { proxy_pass http://allocation-service:8109/; }
        location /wms/      { proxy_pass http://wms-service:8110/; }
        location /store/    { proxy_pass http://store-service:8092/; }

        # ── Logistics ──
        location /carrier/  { proxy_pass http://carrier-service:8083/; }
        location /transport/{ proxy_pass http://transport-planner:8108/; }
        location /delivery/ { proxy_pass http://delivery-service:8100/; }
        location /shipment/ { proxy_pass http://shipment-service:8086/; }
        location /label/    { proxy_pass http://label-generator:8103/; }
        location /location/ { proxy_pass http://location-manager:8089/; }

        # ── Finance ──
        location /billing/  { proxy_pass http://billing-engine:8135/; }
        location /finance/  { proxy_pass http://finance-service:8107/; }
        location /payment/  { proxy_pass http://payment-service:8085/; }
        location /escrow/   { proxy_pass http://escrow-gateway:8130/; }
        location /subscription-billing/ { proxy_pass http://subscription-billing:8136/; }
        location /contract/ { proxy_pass http://contract-manager:8105/; }
        location /lineage/  { proxy_pass http://lineage-service:8145/; }

        # ── Intelligence ──
        location /notification/ { proxy_pass http://notification-service:8096/; }
        location /feed/     { proxy_pass http://feed-service:8101/; }
        location /supplymate/ { proxy_pass http://supply-mate-service:8118/; }
    }
}
